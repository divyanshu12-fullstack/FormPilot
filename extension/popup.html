<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FormPilot</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="progress-line" id="progress-line" aria-hidden="true"></div>

  <main class="popup">
    <header class="popup-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 128 128" width="16" height="16" fill="currentColor">
            <rect x="32" y="24" width="17" height="80" rx="8.5"/>
            <rect x="32" y="24" width="64" height="17" rx="8.5"/>
            <rect x="32" y="56" width="40" height="16" rx="8"/>
            <rect x="80" y="56" width="16" height="16" rx="8"/>
          </svg>
        </span>
        <span class="brand-name">FormPilot</span>
      </div>

      <button id="settings-button" class="icon-btn" type="button" aria-label="Profile and settings" title="Profile and settings">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h8M17 7h3M4 12h3M12 12h8M4 17h7M16 17h4"/>
          <circle cx="14.5" cy="7" r="2.2"/>
          <circle cx="9.5" cy="12" r="2.2"/>
          <circle cx="13.5" cy="17" r="2.2"/>
        </svg>
      </button>
    </header>

    <section class="status-card" id="status-card" data-state="loading" aria-live="polite">
      <span class="state-icon" aria-hidden="true">
        <svg class="glyph glyph-loading" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
          <circle cx="12" cy="12" r="8" stroke-dasharray="32 18"/>
        </svg>
        <svg class="glyph glyph-ready" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 4.5h8l4 4V19a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1Z"/>
          <path d="M14 4.5v4h4"/>
          <path d="M8.5 12.5h7M8.5 16h4"/>
        </svg>
        <svg class="glyph glyph-done" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.5"/>
          <path d="m8.5 12.2 2.4 2.4 4.6-4.8"/>
        </svg>
        <svg class="glyph glyph-warn" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4.8 21 19H3l9-14.2Z"/>
          <path d="M12 10v4"/>
          <path d="M12 16.8h.01"/>
        </svg>
        <svg class="glyph glyph-blocked" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8.5"/>
          <path d="m8.8 8.8 6.4 6.4"/>
        </svg>
      </span>

      <div class="status-copy">
        <p class="status-title" id="status-title">Checking this page…</p>
        <p class="status-detail" id="status-detail">Looking for fields FormPilot can fill.</p>
      </div>

      <button id="fill-button" class="btn btn-primary btn-block" type="button" hidden>Fill this page</button>
      <button id="secondary-button" class="btn btn-secondary btn-block" type="button" hidden></button>
    </section>

    <section id="result-panel" class="result-panel" aria-labelledby="result-title" hidden>
      <div class="result-head">
        <h2 id="result-title">Fill results</h2>
        <div id="result-counts" class="result-counts"></div>
      </div>
      <ul id="result-details" class="result-details"></ul>
    </section>

    <footer class="popup-foot">
      <span class="host">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"/>
          <path d="M3.5 12h17"/>
          <path d="M12 3.5c2.2 2.4 3.3 5.3 3.3 8.5s-1.1 6.1-3.3 8.5c-2.2-2.4-3.3-5.3-3.3-8.5S9.8 5.9 12 3.5Z"/>
        </svg>
        <span id="page-host">Checking this page…</span>
      </span>
      <span class="local-note">Local only</span>
    </footer>
  </main>

  <script src="shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
