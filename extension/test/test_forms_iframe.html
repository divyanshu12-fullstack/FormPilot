<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FormPilot — iframe fixture</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #fff; color: #561d46; }
  label { display: block; margin: 6px 0 2px; }
  input, select { padding: 5px; border: 1px solid #b89aad; border-radius: 4px; }
  .row { margin: 8px 0; }
</style>
</head>
<body>
<div class="row">
  <label for="if_email">Email</label>
  <input type="email" id="if_email" name="if_email" placeholder="you@example.com">
</div>
<div class="row">
  <div>Gender</div>
  <label><input type="radio" name="if_gender" value="Male"> Male</label>
  <label><input type="radio" name="if_gender" value="Female"> Female</label>
</div>
<div class="row">
  <label for="if_country">Country</label>
  <select id="if_country" name="if_country">
    <option value="">Select…</option>
    <option value="IN">India</option>
    <option value="US">United States</option>
  </select>
</div>
</body>
</html>
